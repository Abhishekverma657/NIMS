<svg 
  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="200" height="240" fill="url(#bgGrad)"/>
  <!-- Subtle Medical Cross watermark in background -->
  <g opacity="0.06" fill="#0f172a">
    <rect x="90" y="25" width="20" height="60" rx="10"/>
    <rect x="70" y="45" width="60" height="20" rx="10"/>
  </g>
  <!-- Doctor Silhouette Group -->
  <g filter="url(#softShadow)">
    <!-- Shoulders / Torso Base -->
    <path d="M 28 240 C 28 178, 55 148, 100 148 C 145 148, 172 178, 172 240 Z" fill="#e2e8f0"/>
    <!-- Inner V-Neck Scrub (Clinical Blue) -->
    <path d="M 72 152 L 100 198 L 128 152 C 119 148, 81 148, 72 152 Z" fill="url(#scrubGrad)"/>
    <!-- White Lab Coat Lapels -->
    <!-- Left Lapel -->
    <path d="M 32 240 C 34 186, 56 150, 84 148 L 100 202 L 76 240 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Right Lapel -->
    <path d="M 168 240 C 166 186, 144 150, 116 148 L 100 202 L 124 240 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Lab Coat Collar Fold -->
    <path d="M 66 150 L 84 178 L 74 182 Z" fill="#e2e8f0"/>
    <path d="M 134 150 L 116 178 L 126 182 Z" fill="#e2e8f0"/>
    <!-- Stethoscope -->
    <!-- Tubing around neck -->
    <path d="M 78 154 C 74 175, 78 205, 92 216 C 96 219, 104 219, 108 216 C 116 208, 122 185, 122 154" 
          fill="none" stroke="#bd171c" stroke-width="4" stroke-linecap="round"/>
    <!-- Stethoscope binaural connection -->
    <path d="M 88 214 L 88 226" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Chest Piece (Bell) -->
    <circle cx="88" cy="231" r="7.5" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="88" cy="231" r="3.5" fill="#f8fafc"/>
    <!-- Neck -->
    <path d="M 86 118 L 86 150 C 90 153, 110 153, 114 150 L 114 118 Z" fill="#cbd5e1"/>
    <!-- Head Base (Neutral Professional Silhouette) -->
    <circle cx="100" cy="88" r="34" fill="#94a3b8"/>
    <!-- Hair / Clean Head Contour in Medical Navy -->
    <path d="M 68 85 C 68 56, 80 44, 100 44 C 120 44, 132 56, 132 85 C 132 89, 131 94, 129 97 C 127 82, 118 72, 100 72 C 82 72, 73 82, 71 97 C 69 94, 68 89, 68 85 Z" fill="#1e293b"/>
  </g>
  <!-- Small Caduceus / Hospital Emblem at Bottom Corner -->
  <g transform="translate(162, 204) scale(0.65)" opacity="0.4">
    <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 20 8 L 20 32 M 10 16 L 30 16 M 12 24 L 28 24" stroke="#bd171c" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>

